name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"

jobs:
  release:
    name: tag
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      notes: ${{ steps.release.outputs.release_notes }}
    steps:
      - name: Checkout the commit CI validated
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Stay on the validated commit
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git reset --hard "$RELEASE_SHA"

      - name: Tag
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: false
          changelog: false
          build: false
          vcs_release: false

  publish:
    name: wheel, SBOM, checksums and PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pulse-orchestrator/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Build wheel, SBOM and checksums
        run: |
          uv build --out-dir dist
          uv export --locked --no-dev --format cyclonedx1.5 -o dist/pulse.cdx.json
          sha256sum dist/* > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
      - name: Publish to PyPI
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/*.whl dist/*.tar.gz
      - name: Create the GitHub release with its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_NOTES: ${{ needs.release.outputs.notes }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice title=Release already published::$RELEASE_TAG"
            exit 0
          fi
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
