openapi: 3.0.3
info:
  title: Pulse Engine API
  version: 0.1.0
  description: >-
    Local clients only. Any request carrying an `Origin` header (a browser) is
    refused with 403 before routing, and `Host` must be 127.0.0.1, localhost or
    pulse (400 otherwise). See docs/adr/0003-listeners-locais-recusam-navegador.md.
    Over TCP every request must carry `Authorization: Bearer <token>`, the
    per-daemon token in ~/.pulse/daemon.json (401 otherwise); the Unix socket
    is user-only and needs none. See docs/adr/0005-tcp-exige-token-do-daemon.md.
paths:
  /api/status:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/doctor:
    get:
      summary: Environment checks
      responses:
        "200":
          description: Check results
  /api/doctor/acp-probe:
    post:
      summary: Open an ACP session with the resolved agent and send a test prompt
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
          description: Project whose agent override applies; the engine's own directory otherwise
        - name: runtime
          in: query
          required: false
          schema:
            type: string
          description: Probe this runtime's ACP command instead of the configured agent (onboarding)
      responses:
        "200":
          description: ok, message, error, response_text and available_models of the probe
        "404":
          description: Unknown runtime
  /api/workflows:
    get:
      summary: List workflows defined in the database
      responses:
        "200":
          description: Workflow definitions, each with its ordered steps
  /api/workflows/{workflow_id}/runs:
    post:
      summary: Start a workflow run
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: >-
                    The task as one text. Send either prompt or title and
                    description, never both (422).
                title:
                  type: string
                  description: >-
                    Names the run in history and titles its pull request. With
                    description, it becomes the run's prompt: title, a blank
                    line, then description.
                description:
                  type: string
                git:
                  type: object
                  nullable: true
                  description: >-
                    Git options for this run only; the project settings are not
                    changed. Null or absent follows the project settings. Each
                    option needs the one before it (commits need the worktree,
                    a pull request needs commits); an orphan option is a 422.
                    A resumed run keeps the options it started with.
                  required: [use_worktree, atomic_commits, auto_pull_request]
                  properties:
                    use_worktree:
                      type: boolean
                    atomic_commits:
                      type: boolean
                    auto_pull_request:
                      type: boolean
                workspace:
                  type: string
                  nullable: true
                resume_run_id:
                  type: string
                  nullable: true
                  description: >-
                    Resume a previous run instead of creating one; it picks up at
                    the first step that is not done or skipped. The resumed run
                    keeps its id, so the run id is stable across resumes
                branch:
                  type: string
                  description: >-
                    Branch the worktree is created on, when the project isolates
                    runs. Empty lets the engine slug the prompt. Ignored on resume.
      responses:
        "200":
          description: Run created
        "404":
          description: Unknown workflow id
        "422":
          description: >-
            Both prompt and title/description, or git options out of order
        "409":
          description: That run is already executing
        "503":
          description: The daemon is shutting down and starts no new run
  /api/runs:
    get:
      summary: Runs the engine holds in memory, active ones first
      description: >-
        How a client finds what is still running in the background and reopens
        it. Finished runs linger for a while so they stay attachable, then drop
        out; the database keeps the past either way.
      responses:
        "200":
          description: >-
            Each run: id, workflow_id, workflow_label, title, prompt, workspace,
            status, active, awaiting_prompt, awaiting_since,
            current_step_label, started_at, exit_code.
            status is awaiting_input while an active run has an open question
            waiting on the user (tool permission, questionnaire, approval,
            retry menu); awaiting_since is when that wait started, in epoch
            seconds. Both are derived from the open questions, not stored: a
            run that is waiting is not finished, it is just not working.
  /api/runs/{run_id}:
    get:
      summary: Get run status
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run state
  /api/runs/{run_id}/cancel:
    post:
      summary: Stop a run
      description: >-
        Cuts the step in flight and cancels the open questions. The interrupted
        step goes back to pending, so resuming the run starts from it.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stop requested
        "404":
          description: Unknown run id
  /api/runs/{run_id}/events:
    get:
      summary: SSE event stream for a run, replayed from the start
      description: >-
        A new subscriber receives the whole run since run.started, then
        stream.replay_end, then live events. That is what lets a client reopen a
        run it walked away from and see exactly what was on screen.
        stream.ping marks an idle stream and carries no run data.
        run.awaiting carries waiting: true when the run stops to ask the user
        something and waiting: false when it is answered, so a client can
        freeze the step clock for exactly as long as the question is open.
        run.context carries cwd and branch: where this run works — its own git
        worktree, when the project has that turned on — and the branch it works
        on. It is published before the first step, so a client that attaches
        later gets it from the replay and reads artifacts from the right
        directory.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Skip the first N events, for a client that already has them
      responses:
        "200":
          description: text/event-stream
  /api/prompts/{prompt_id}/answer:
    post:
      summary: Answer a pending prompt
      parameters:
        - name: prompt_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted
  /api/history:
    get:
      summary: List history items, runs still executing first
      description: >-
        In-progress runs are listed before the past, newest first within each
        group. They are the only items a client can still enter and take part
        in, so they do not belong buried in the history.
      responses:
        "200":
          description: >-
            History items. Each carries branch and worktree_path: the branch the
            run worked on, and its own worktree when it ran isolated. Both are
            empty for a run that predates worktree support or a project outside
            git. duration_seconds is the net time already closed by the steps
            (user wait excluded), or null until a step has recorded time.
  /api/history/{item_id}:
    get:
      summary: One history item
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: History item
        "404":
          description: Not found
    delete:
      summary: Remove a run from the history
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
        "404":
          description: Not found
        "409":
          description: The daemon still executes the run; its agent works in the worktree
  /api/history/{item_id}/worktree:
    get:
      summary: What removing the run's worktree would throw away
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: >-
            path, exists, dirty (uncommitted work; true when git cannot tell) and
            active (the daemon still executes the run, so removal is refused)
        "404":
          description: Not found
    delete:
      summary: Remove the run's worktree; a dirty one is never forced, the branch stays
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
        - name: workspace
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: removed is false when git refused, and the stored path is kept
        "404":
          description: Not found
        "409":
          description: The daemon still executes the run; its agent works in the worktree
  /api/runs/{run_id}/log:
    get:
      summary: The persisted run, so a screen can rebuild its steps, log and artifacts
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            RunLog (pulse/history/run_log.py): exec_root, branch, steps with
            their timings, events and artifacts
        "404":
          description: Unknown run
  /api/setup:
    get:
      summary: Where the first run stands
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: configured, onboarded, ready, workspace_dir, database and permission_policies
  /api/setup/onboarding:
    post:
      summary: Save what the setup wizard collected and open the workspace as a project
      description: >-
        The runtime's binary and ACP command come from its registered class,
        never from the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime, workspace, model, permission_policy, auth_method]
              properties:
                runtime:
                  type: string
                workspace:
                  type: string
                model:
                  type: string
                permission_policy:
                  type: string
                auth_method:
                  type: string
                acp_test_passed:
                  type: boolean
      responses:
        "200":
          description: ok and the database path
        "404":
          description: Unknown runtime
        "422":
          description: Unknown permission policy
  /api/runtimes:
    get:
      summary: Every registered runtime, with its login command, and the default one
      responses:
        "200":
          description: default and runtimes
  /api/runtimes/{runtime_id}/checks:
    get:
      summary: The runtime's CLI checks, then its login check
      parameters:
        - name: runtime_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: checks
        "404":
          description: Unknown runtime
  /api/models:
    get:
      summary: Models an agent offers
      description: >-
        Advertised over ACP, else declared by its runtime, else Pulse's list.
        Opens the agent's ACP command, so it can take seconds.
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
        - name: runtime
          in: query
          required: false
          schema:
            type: string
          description: A configured agent name; may be a custom ACP command
      responses:
        "200":
          description: models
  /api/settings:
    get:
      summary: What the settings screen shows for a project
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: >-
            is_repo, use_worktree, the effective defaults, each agent's
            effective runtime, model and policy, the runtimes to pick from and
            the permission policies
  /api/settings/defaults:
    patch:
      summary: Set a project-wide runtime, model or policy; written into every agent too
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldBody"
      responses:
        "200":
          description: Saved
        "422":
          description: Unknown field or policy, or an empty value
  /api/settings/agents/{agent_id}:
    patch:
      summary: Set one agent's runtime, model or policy in this project
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldBody"
      responses:
        "200":
          description: Saved
        "404":
          description: Unknown agent
        "422":
          description: Unknown field or policy, or an empty value
  /api/git/branch:
    get:
      summary: Whether a branch name is valid and already used in the workspace repo
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: valid and exists
  /api/workspace/files:
    get:
      summary: Files a task can mention with @, relative to the project root, minus git-ignored ones
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: >-
            files (tracked) and untracked (new, not ignored), both empty
            outside a git repository. A worktree run starts from a commit, so
            only tracked files exist where it works.
  /api/settings/atomic-commits:
    put:
      summary: Turn atomic commits on or off; requires the worktree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace, enabled]
              properties:
                workspace:
                  type: string
                enabled:
                  type: boolean
      responses:
        "200":
          description: Saved
        "422":
          description: Worktree is off
  /api/settings/pull-request:
    put:
      summary: Turn automatic pull requests on or off; requires worktree and atomic commits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace, enabled]
              properties:
                workspace:
                  type: string
                enabled:
                  type: boolean
      responses:
        "200":
          description: Saved
        "422":
          description: Worktree or atomic commits is off
  /api/settings/worktree:
    put:
      summary: Turn the per-run worktree on or off for a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace, enabled]
              properties:
                workspace:
                  type: string
                enabled:
                  type: boolean
      responses:
        "200":
          description: Saved
  /api/config:
    get:
      summary: Global and project config
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
          description: Project whose config is returned; the engine's own directory otherwise
      responses:
        "200":
          description: >-
            Config payload. The project side carries use_worktree: with it on,
            every run of that project opens its own git worktree on a new
            branch instead of writing in the working tree. It is a project
            setting only — the machine does not get to isolate someone else's
            repository.
  /api/config/resolved:
    get:
      summary: The config a run would use, after the project and machine cascade
      parameters:
        - name: workflow
          in: query
          required: false
          schema:
            type: string
        - name: workspace
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: >-
            agent, model, permission_policy, workspace, use_worktree,
            acp_command and auth_method.
  /api/config/global:
    patch:
      summary: Change the machine defaults
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  nullable: true
                permission_policy:
                  type: string
                  nullable: true
                  enum: [ask, auto_approve, deny_writes]
                default_agent:
                  type: string
                  nullable: true
      responses:
        "200":
          description: ok and the machine config after the change
  /api/config/project:
    post:
      summary: Register a directory as a Pulse project, with its workflow rows; idempotent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace]
              properties:
                workspace:
                  type: string
      responses:
        "200":
          description: ok and the project root
components:
  securitySchemes:
    daemonToken:
      type: http
      scheme: bearer
      description: Required on the TCP listener only; read from ~/.pulse/daemon.json.
  schemas:
    FieldBody:
      type: object
      required: [workspace, field, value]
      properties:
        workspace:
          type: string
        field:
          type: string
          enum: [runtime, model, permission_policy]
        value:
          type: string
